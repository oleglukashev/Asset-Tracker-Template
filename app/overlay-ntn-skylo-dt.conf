# PDN configuration for Deutsche Telekom SIM card
CONFIG_LTE_LC_PDN_DEFAULTS_OVERRIDE=y
CONFIG_LTE_LC_PDN_DEFAULT_FAM_IPV4=y
# Device-to-Cloud APN: required to reach the D2C UDP ingest 172.27.130.100:15501.
# For direct internet access (own public IP in CONFIG_APP_NTN_SERVER_ADDR) use instead:
# CONFIG_LTE_LC_PDN_DEFAULT_APN="internet.m2mportal.de"
CONFIG_LTE_LC_PDN_DEFAULT_APN="device-to-cloud.iot.telekom.de"
